name: Images

# Builds every image and pushes it to GitHub Container Registry when CI passes on main.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: registry, file: registry/Dockerfile }
          - { name: ui, file: ui/Dockerfile }
          - { name: ingestor, file: ingestor/Dockerfile }
          - { name: db-init, file: db/Dockerfile }
          - { name: price-history, file: services/Dockerfile, service: price_history }
          - { name: performance, file: services/Dockerfile, service: performance }
          - { name: volatility-risk, file: services/Dockerfile, service: volatility_risk }
          - { name: indicators, file: services/Dockerfile, service: indicators }
          - { name: fund-builder, file: services/Dockerfile, service: fund_builder }
          - { name: portfolio, file: services/Dockerfile, service: portfolio }
          - { name: correlation, file: services/Dockerfile, service: correlation_svc }
          - { name: alerts-monitor, file: services/Dockerfile, service: alerts_monitor }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.service && format('SERVICE={0}', matrix.service) || '' }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/stock-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/stock-${{ matrix.name }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
